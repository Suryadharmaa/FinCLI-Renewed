[package]
name = "fincli"
version = "2.0.1"
description = "FinCLI Windows desktop workspace"
authors = ["FinCLI"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
tauri-plugin-single-instance = "2.0"
uuid = { version = "1", features = ["v4"] }
